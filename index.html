function start(){
 const vertex=`
 attribute vec3 position, normal, tangent, bitangent;
 attribute vec2 uv;
 uniform vec3 view;
 uniform float aspect;
 varying vec2 vUV;
 varying vec3 n,t,b,eye;
 vec3 rotate(vec3 p){
   float c=cos(view.x),s=sin(view.x),a=cos(view.y),d=sin(view.y);
   vec3 q=vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z);
   return vec3(q.x,a*q.y-d*q.z,d*q.y+a*q.z);
 }
 void main(){
   vec3 p=rotate(position);
   n=rotate(normal);t=rotate(tangent);b=rotate(bitangent);vUV=uv;
   eye=vec3(0.,0.,6.)-p;
   gl_Position=vec4(p.x*view.z/aspect,p.y*view.z,-p.z/6.,1.-p.z/6.);
 }`;
 const fragment=`
 precision mediump float;
 uniform sampler2D ink, relief, instagram, facebook;
 uniform bool socialFace;
 uniform bool colouredStock;
 uniform vec3 stockColour;
 uniform vec2 texel;
 varying vec2 vUV;
 varying vec3 n,t,b,eye;
 void main(){
   // The original PNGs are separate from the coating and embossing.
   if(socialFace){
     vec2 panelSize=2./texel;
     vec2 point=vec2((vUV.x-.5)*panelSize.x+26.5,(1.-vUV.y)*panelSize.y);
     if(point.x>=0. && point.x<53.){
       if(point.y>=110. && point.y<163.){
         gl_FragColor=texture2D(instagram,vec2(point.x,163.-point.y)/53.);
         return;
       }
       if(point.y>=192. && point.y<245.){
         gl_FragColor=texture2D(facebook,vec2(point.x,245.-point.y)/53.);
         return;
       }
     }
   }
   vec3 print=texture2D(ink,vUV).rgb;
   vec2 surface=texture2D(relief,vUV).rg;
   if(colouredStock){
     float goldMask=smoothstep(.025,.13,print.r-print.b)*smoothstep(.13,.38,print.r);
     float neutral=dot(print,vec3(.299,.587,.114));
     vec3 board=stockColour*(.72+neutral*1.9)+vec3(pow(neutral,3.)*.12);
     print=mix(board,print,goldMask);
   }
   float dx=texture2D(relief,vUV+vec2(texel.x,0.)).r-texture2D(relief,vUV-vec2(texel.x,0.)).r;
   float dy=texture2D(relief,vUV+vec2(0.,texel.y)).r-texture2D(relief,vUV-vec2(0.,texel.y)).r;
   vec3 normal=normalize(normalize(n)-dx*normalize(t)*2.6-dy*normalize(b)*2.6);
   vec3 key=normalize(vec3(-.57,.76,1.));
   vec3 fill=normalize(vec3(.78,.25,.60));
   float lighting=.57+.32*max(0.,dot(normal,key))+.15*max(0.,dot(normal,fill));
   vec3 halfVector=normalize(key+normalize(eye));
   float highlight=pow(max(0.,dot(normal,halfVector)),23.);
   vec3 reflection=reflect(-normalize(eye),normal);
   // A tall softbox moves across the coated board as the carton rotates.
   vec3 softbox=normalize(vec3(-.60,.46,.84));
   vec3 across=normalize(cross(vec3(0.,1.,0.),softbox));
   vec3 upright=cross(softbox,across);
   float strip=(1.-smoothstep(.045,.22,abs(dot(reflection,across))))
              *(1.-smoothstep(.16,.63,abs(dot(reflection,upright))))
              *smoothstep(.58,.93,dot(reflection,softbox));
   float satin=.17*strip+.062*pow(max(0.,dot(normal,halfVector)),15.);
   float foil=surface.g*smoothstep(.13,.48,max(print.r,print.g));
   vec3 lit=print*lighting;
   gl_FragColor=vec4(mix(lit,vec3(1.,.965,.91),satin)+highlight*vec3(1.,.86,.61)*(.016+.20*foil),1.);
 }`;
 const program=gl.createProgram();
 for(const [kind,source] of [[gl.VERTEX_SHADER,vertex],[gl.FRAGMENT_SHADER,fragment]]){
   const shader=gl.createShader(kind);gl.shaderSource(shader,source);gl.compileShader(shader);
   if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));
   gl.attachShader(program,shader);
 }
 gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
 gl.useProgram(program);
 const u=Object.fromEntries(['ink','relief','view','aspect','texel','instagram','facebook','socialFace','colouredStock','stockColour'].map(id=>[id,gl.getUniformLocation(program,id)]));
 const ext=[.65625,1,.34375], bevel=.012;
 // Tangent axes follow each photographed panel from left to right and bottom to top.
 const faces=[
   [2,1,0,1,1,1],[0,1,2,1,-1,1],[2,-1,0,1,-1,1],
   [0,-1,2,1,1,1],[1,1,0,2,1,-1],[1,-1,0,2,1,1]
 ];
 const data=[];
 for(const [major,sign,horizontal,vertical,xsign,ysign] of faces){
   const col=[-ext[horizontal],-ext[horizontal]+bevel,ext[horizontal]-bevel,ext[horizontal]];
   const row=[-ext[vertical],-ext[vertical]+bevel,ext[vertical]-bevel,ext[vertical]];
   const tangent=[0,0,0],bitangent=[0,0,0];tangent[horizontal]=xsign;bitangent[vertical]=ysign;
   function emit(x,y){
     const raw=[0,0,0];raw[major]=sign*ext[major];raw[horizontal]=col[x]*xsign;raw[vertical]=row[y]*ysign;
     const corner=raw.map((v,i)=>Math.max(-ext[i]+bevel,Math.min(ext[i]-bevel,v)));
     const delta=raw.map((v,i)=>v-corner[i]);const len=Math.hypot(...delta);
     const normal=delta.map(v=>v/len);
     data.push(...corner.map((v,i)=>v+normal[i]*bevel),...normal,...tangent,...bitangent,
       .5+col[x]/(2*ext[horizontal]),.5+row[y]/(2*ext[vertical]));
   }
   for(let x=0;x<3;x++)for(let y=0;y<3;y++){
     emit(x,y);emit(x+1,y);emit(x+1,y+1);emit(x,y);emit(x+1,y+1);emit(x,y+1);
   }
 }

 for(const [name,count,offset] of [['position',3,0],['normal',3,3],['tangent',3,6],['bitangent',3,9],['uv',2,12]]){
   const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,count,gl.FLOAT,false,56,offset*4);
 }
 gl.enable(gl.DEPTH_TEST);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
 gl.uniform1i(u.ink,0);gl.uniform1i(u.relief,1);
 const stockColours=[[.88,.52,.60],[.31,.035,.085],[.23,.07,.30],[.055,.047,.058]];
 let stock=-1;
 let selected=0,yaw=-.44,pitch=.23,zoom=1;
 gl.uniform1i(u.instagram,2);gl.uniform1i(u.facebook,3);
 function loadTexture(src, placeholder){

   const item={texture:gl.createTexture(),width:1,height:1};
   gl.bindTexture(gl.TEXTURE_2D,item.texture);
   gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,1,1,0,gl.RGB,gl.UNSIGNED_BYTE,new Uint8Array(placeholder));
   for(const axis of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,axis,gl.CLAMP_TO_EDGE);
   gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
   const img=new Image();
   img.onload=()=>{
     item.width=img.width;item.height=img.height;
     gl.bindTexture(gl.TEXTURE_2D,item.texture);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,img);draw();
   };
   img.src=src;
   return item;
 }
 const bank=artwork.map(faces=>faces.map(([ink,relief])=>[
   loadTexture(ink,[235,228,216]),loadTexture(relief,[127,0,0])
 ]));
 const qrTextures=socialCodes.map(src=>loadTexture(src,[255,255,255]));
 function draw(){
   gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
   const aspect=canvas.width/canvas.height;
   gl.uniform1f(u.aspect,aspect);gl.uniform3f(u.view,yaw,pitch,Math.min(.66,.88*aspect)*zoom);
   qrTextures.forEach((item,i)=>{
     gl.activeTexture(gl.TEXTURE2+i);gl.bindTexture(gl.TEXTURE_2D,item.texture);
   });
   gl.uniform1i(u.colouredStock,stock>=0);
   gl.uniform3fv(u.stockColour,stockColours[Math.max(0,stock)]);
   bank[selected].forEach(([ink,relief],i)=>{
     gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,ink.texture);
     gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,relief.texture);
     gl.uniform1i(u.socialFace,i===3);
     gl.uniform2f(u.texel,2/relief.width,2/relief.height);
     gl.drawArrays(gl.TRIANGLES,i*54,54);
   });
 }
 function resize(){
   const d=Math.min(2.5,Math.max(1.5,devicePixelRatio));
   canvas.width=Math.max(1,Math.round(canvas.clientWidth*d));canvas.height=Math.max(1,Math.round(canvas.clientHeight*d));draw();
 }
 const choices=[...document.querySelectorAll('[data-design]')];
 const colours=[...document.querySelectorAll('[data-colour]')];
 function updateChoices(){
   choices.forEach(button=>{
     const design=Number(button.dataset.design);
     button.hidden=stock>=0&&design<2;
     button.setAttribute('aria-pressed',String(design===selected));
     button.querySelector('span').textContent=stock>=0?'Gold detailing':design<2?'White & gold':'Black & gold';
   });
   colours.forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.colour)===stock)));
   draw();
 }
 for(const button of choices)button.addEventListener('click',()=>{
   selected=Number(button.dataset.design);updateChoices();
 });
 for(const button of colours)button.addEventListener('click',()=>{
   stock=Number(button.dataset.colour);
   if(stock>=0)selected=2+selected%2;
   updateChoices();
 });
 const views={front:[0,0],back:[Math.PI,0],mark:[-Math.PI/2,0],social:[Math.PI/2,0],top:[0,Math.PI/2],base:[0,-Math.PI/2],reset:[-.44,.23]};
 function scale(factor){zoom=Math.max(.62,Math.min(2.7,zoom*factor));draw();}
 function rotate(x,y){yaw=(yaw+x)%(Math.PI*2);pitch=Math.max(-Math.PI/2,Math.min(Math.PI/2,pitch+y));draw();}
 for(const btn of document.querySelectorAll('[data-view]'))btn.addEventListener('click',()=>{
   const key=btn.dataset.view;
   if(key==='in'||key==='out'){scale(key==='in'?1.18:1/1.18);return;}
   [yaw,pitch]=views[key];if(key==='reset')zoom=1;draw();
 });
 canvas.addEventListener('wheel',e=>{e.preventDefault();scale(Math.exp(-e.deltaY*.0015));},{passive:false});
 const pointers=new Map();
 const distance=()=>{const [a,b]=pointers.values();return Math.hypot(a.x-b.x,a.y-b.y);};
 canvas.addEventListener('pointerdown',e=>{
   if(e.pointerType==='mouse'&&e.button!==0)return;
   canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 });
 canvas.addEventListener('pointermove',e=>{
   const old=pointers.get(e.pointerId);if(!old)return;
   const before=pointers.size===2?distance():0;
   pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
   if(before>0)scale(distance()/before);
   else if(pointers.size===1)rotate((e.clientX-old.x)*.009,(e.clientY-old.y)*.009);
 });
 for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,e=>pointers.delete(e.pointerId));
 canvas.addEventListener('keydown',e=>{
   const keys={ArrowLeft:[-.15,0],ArrowRight:[.15,0],ArrowUp:[0,.15],ArrowDown:[0,-.15]};
   if(keys[e.key]){e.preventDefault();rotate(...keys[e.key]);}
   if(['+','=','-'].includes(e.key)){e.preventDefault();scale(e.key==='-'?1/1.15:1.15);}
 });
 new ResizeObserver(resize).observe(canvas);resize();
}
</script>
</html>
